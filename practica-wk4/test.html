<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tests — Gestor de Citas Médicas</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="app-header">
    <h1>Gestor de Citas Médicas</h1>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="registro.html">Registro</a>
      <a href="test.html">Tests</a>
    </nav>
  </header>
  <main class="container">
    <div class="test-summary">
      <h2>Resultados de Tests</h2>
      <div id="resultados"></div>
    </div>
  </main>

  <script src="js/test-runner.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/tests/registro.test.js"></script>
  <script src="js/tests/login.test.js"></script>
  <script src="js/tests/recuperar.test.js"></script>
  <script>
    // Ejecutar los tests y mostrar los resultados
    const resultados = TestRunner.run();
    const contenedor = document.getElementById('resultados');

    let pasados = 0;
    for (const r of resultados) {
      const div = document.createElement('div');
      div.className = 'test-result ' + r.estado;
      div.textContent = (r.estado === 'pass' ? '✔ ' : '✘ ') + r.nombre +
        (r.error ? ' — ' + r.error : '');
      contenedor.appendChild(div);
      if (r.estado === 'pass') pasados++;
    }

    const resumen = document.createElement('h3');
    resumen.textContent = pasados + ' / ' + resultados.length + ' tests pasados';
    contenedor.insertBefore(resumen, contenedor.firstChild);
  </script>
</body>
</html>
